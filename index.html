<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio | Minacraft</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid #1e293b;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
    }

    nav a {
      margin-left: 28px;
      color: #94a3b8;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #38bdf8;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px 60px;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 70%);
    }

    .hero-content h1 {
      font-size: 3.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .hero-content h1 span {
      color: #38bdf8;
    }

    .hero-content p {
      font-size: 1.25rem;
      color: #94a3b8;
      max-width: 600px;
      margin: 0 auto 40px;
    }

    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.3s;
    }

    .btn:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      margin-left: 12px;
    }

    .btn-outline:hover {
      background: #38bdf8;
      color: #0f172a;
    }

    /* Sections */
    section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 90px 20px;
    }

    h2 {
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 12px;
    }

    .section-subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 50px;
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 50px;
      align-items: center;
    }

    .about-text p {
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .skill {
      background: #1e293b;
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* Projects */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .project-card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      border: 1px solid #334155;
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .project-img {
      height: 180px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .project-info {
      padding: 24px;
    }

    .project-info h3 {
      margin-bottom: 8px;
      color: #f1f5f9;
    }

    .project-info p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .project-links a {
      color: #38bdf8;
      font-weight: 600;
      margin-right: 16px;
      font-size: 0.95rem;
    }

    .project-links a:hover {
      text-decoration: underline;
    }

    /* Contact */
    .contact {
      text-align: center;
      background: #1e293b;
      border-radius: 20px;
      padding: 60px 30px;
      margin: 40px 20px 80px;
    }

      color: #94a3b8;
      margin-bottom: 30px;
      max-width: 500px;
      margin-left
